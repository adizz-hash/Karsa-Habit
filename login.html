<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jadwal Harian & Tracker Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Catatan Harian</h1>
                <p class="login-subtitle">Kelola jadwal olahraga & belajar harianmu</p>
            </div>

            <div id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="loginUsername"> Username:</label>
                    <input type="text" id="loginUsername" placeholder="Masukkan username Anda" />
                </div>

                <div class="form-group">
                    <label for="loginPassword"> Password:</label>
                    <input type="password" id="loginPassword" placeholder="Masukkan password Anda" />
                </div>

                <button id="btnMasuk" class="btn-login">Masuk</button>

                <div class="login-divider">atau</div>

                <button id="btnDaftar" class="btn-register"> Buat Akun Baru</button>
            </div>

            <div id="registerForm" class="login-form" style="display: none;">
                <div class="form-group">
                    <label for="regUsername"> Username:</label>
                    <input type="text" id="regUsername" placeholder="Pilih username Anda" />
                </div>

                <div class="form-group">
                    <label for="regPassword"> Password:</label>
                    <input type="password" id="regPassword" placeholder="Buat password yang kuat" />
                </div>

                <div class="form-group">
                    <label for="regPasswordConfirm"> Konfirmasi Password:</label>
                    <input type="password" id="regPasswordConfirm" placeholder="Ketik ulang password Anda" />
                </div>

                <button id="btnSimpanDaftar" class="btn-login"> Daftar</button>
                <button id="btnKembaliLogin" class="btn-back"> Kembali ke Login</button>
            </div>

            <div id="guestOption" class="guest-option">
                <p>Atau lanjutkan sebagai <strong>Tamu</strong> tanpa login</p>
                <button id="btnLanjutTamu" class="btn-guest">Lanjut Sebagai Tamu</button>
            </div>
        </div>

        <div id="toastNotification" class="toast-notification"></div>
    </div>

    <script src="login.js"></script>
</body>

</html>
